name: DSH lockfile synchronization

on:
  push:
    branches:
      - feat/dsh-native-provider

permissions:
  contents: read

jobs:
  update-lockfile:
    if: github.repository == 'lingdu-sea/t3code-dsh' && github.ref == 'refs/heads/feat/dsh-native-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.14.0'
          run_install: false
      - name: Regenerate only the deterministic pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify frozen dependency resolution
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Export generated lockfile in bounded base64 lines
        shell: bash
        run: |
          echo 'DSH_LOCKFILE_START'
          base64 -w 256 pnpm-lock.yaml
          echo 'DSH_LOCKFILE_END'
