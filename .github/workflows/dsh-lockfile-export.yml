name: DSH temporary lockfile export
on:
  push:
    branches:
      - feat/dsh-native-provider
permissions:
  contents: read
jobs:
  export-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.14.0'
          run_install: false
      - name: Regenerate and validate pinned lockfile
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Export only generated lockfile
        run: |
          echo 'DSH_LOCKFILE_START'
          base64 -w 256 pnpm-lock.yaml
          echo 'DSH_LOCKFILE_END'
